[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rallymotionreasoner"
version = "0.1.0"
description = "Stroke-evidence-grounded tactical reasoning for tennis videos"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Yifan Mei"},
  {name = "Qingling Shi"},
  {name = "Changli Wu"},
  {name = "Jiayuan Rao"},
  {name = "Jiayi Ji"},
  {name = "Liujuan Cao"},
]
keywords = ["tennis", "video understanding", "multimodal reasoning", "evidence grounding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24,<3", "Pillow>=9.5,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["torch>=2.1,<3"]
generation = [
  "torch>=2.1,<3",
  "transformers>=4.57,<5",
  "accelerate>=1,<2",
  "peft>=0.17,<0.19",
  "qwen-vl-utils>=0.0.14,<1",
  "av>=14,<17",
  "sentencepiece>=0.2,<1",
  "decord>=0.6,<1",
]
video = ["opencv-python-headless>=4.8,<5"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
rallymotionreasoner = "rallymotionreasoner.cli:main"

[project.urls]
Homepage = "https://whynotgit2025.github.io/RallyMotionReasoner/"
Repository = "https://github.com/ZSHYC/RallyMotionReasoner"
Issues = "https://github.com/ZSHYC/RallyMotionReasoner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
