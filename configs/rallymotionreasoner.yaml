experiment_name: rallymotionreasoner_rgr
architecture: RallyMotionReasoner-RGR
seed: 42

data:
  dataset: trace
  graph_source: motion_region
  include_label_tokens: false
  require_visual_features: true
  use_edges: true
  max_question_tokens: 64
  max_node_tokens: 24
  max_strokes: 32
  min_count: 1
  label_map_source: train
  evidence_frame_tolerance: 16

module_flags:
  reasoner: relation_temporal_graph_chain
  vlm_adapter: structured_prompt

model:
  time_bias_version: 2
  hidden_dim: 256
  num_layers: 3
  num_heads: 8
  dropout: 0.12

feature_extraction:
  feature_set: motion_region_event_features
  feature_dim: 800
  motion_feature_dim: 0
  feature_root_name: trace/rgr_event_features

training:
  epochs: 120
  batch_size: 64
  lr: 0.0015
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  evidence_threshold_grid: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

loss_weights:
  evidence: 2.0
  key_action: 2.0
  ball_xy: 0.25
  ball_visible: 0.25
  contact_frame: 0.25
  level_1: 1.0
  level_2: 1.0
  level_3: 1.0
  answer_type: 0.5
  answerability: 0.5
  causal_strength: 0.5
  observed_effect: 0.5
